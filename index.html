<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Base SEO - will be overridden by page-specific meta tags -->
    <meta name="description" content="Florian Leux (Toyso) - Développeur frontend senior et illustrateur freelance à Bordeaux. Création de sites web, direction artistique et illustrations digitales pour vos projets.">
    <meta name="keywords" content="développeur web bordeaux, dev frontend bordeaux, illustrateur bordeaux, direction artistique, florian leux, toyso">
    <meta name="author" content="Florian Leux">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Florian Leux - Toyso">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@toyso">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="prefetch" href="/placeholders/placeholder-portrait.webp" crossorigin>
    <link rel="prefetch" href="/placeholders/placeholder-landscape.webp" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=DM+Serif+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <title>Florian Leux - Toyso - Développeur web et illustrateur</title>

    <!-- Prevent FOUC by initializing dark mode before app loads -->
    <script>
      (function() {
        const saved = localStorage.getItem('darkMode');
        // Mode clair par défaut, sombre uniquement si explicitement sauvegardé
        if (saved === 'true') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
